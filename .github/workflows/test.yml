# Test pipeline for LanguageLab.
# Generated by BMad TEA (bmad-testarch-ci). Stack: fullstack | Framework: pytest + pytest-playwright
#
# Shape follows the Epic 1 test design (_bmad-output/test-artifacts/test-design/test-design-epic-1.md):
#   - push to main / PR: lint, then the whole suite in one job on Chromium (`make test-ci`)
#   - PR: E2E burn-in loop for flaky detection
#   - vX.Y.Z tag: the same, plus E2E under WebKit (R-09)
# No Node (NFR-11), no sharding (the suite is seconds long), no retries (dev deps are pinned;
# a flaky test should fail burn-in, not be retried into green).

name: Test Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1" # fail if uv.lock is out of date with pyproject.toml

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: make test-ci

      # The gate must be able to fail: a suite that quietly stops running most of itself
      # should not pass faster. Every collected test must appear in the JUnit report.
      - name: Reconcile executed vs collected
        if: success()
        run: |
          collected=$(uv run pytest --collect-only -q -p no:cacheprovider | tail -n 1 | grep -oE '^[0-9]+')
          executed=$(uv run python -c "import xml.etree.ElementTree as ET; r = ET.parse('test-results/junit.xml').getroot(); s = r if r.tag == 'testsuite' else r.find('testsuite'); print(s.get('tests'))")
          echo "collected=$collected executed=$executed"
          if [ -z "$collected" ] || [ "$collected" -eq 0 ] || [ "$collected" != "$executed" ]; then
            echo "::error::Collected $collected tests but the JUnit report has $executed"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  burn-in:
    name: Burn-In (E2E flaky detection)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: github.event_name == 'pull_request'

    env:
      BURN_IN_ITERATIONS: "10"

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      # Burn-in targets UI flakiness (races, selector instability, timing). One failure in
      # any iteration fails the job: a test that passes 9/10 is not stable.
      - name: Run burn-in loop
        run: make burn-in BURN_IN="$BURN_IN_ITERATIONS"

      - name: Upload burn-in failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burn-in-failures
          path: test-results/
          retention-days: 30

  webkit:
    name: E2E (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Run E2E on Chromium and WebKit
        run: uv run pytest -m e2e --browser chromium --browser webkit --junitxml=test-results/junit-webkit.xml --video=retain-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-webkit
          path: test-results/
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [lint, test, burn-in, webkit]
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: artifacts

      - name: Write job summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BURN_IN_RESULT: ${{ needs.burn-in.result }}
          WEBKIT_RESULT: ${{ needs.webkit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Test Pipeline"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Test (Chromium) | $TEST_RESULT |"
            echo "| Burn-in (PR only) | $BURN_IN_RESULT |"
            echo "| E2E WebKit (tags only) | $WEBKIT_RESULT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          rows = []
          for path in sorted(glob.glob("artifacts/**/junit*.xml", recursive=True)):
              root = ET.parse(path).getroot()
              for s in ([root] if root.tag == "testsuite" else root.findall("testsuite")):
                  rows.append((path.removeprefix("artifacts/"), *(s.get(k, "0") for k in ("tests", "failures", "errors", "skipped"))))
          if rows:
              print("| Report | Tests | Failures | Errors | Skipped |")
              print("| --- | --- | --- | --- | --- |")
              for r in rows:
                  print("| " + " | ".join(r) + " |")
          else:
              print("_No JUnit reports were produced._")
          EOF

          if [ "$BURN_IN_RESULT" = "failure" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Flaky E2E detected.** Download the \`burn-in-failures\` artifact for traces and video." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts (JUnit, traces, screenshots, video on failure): $RUN_URL#artifacts" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any gate failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass ($RESULTS)"
              exit 1
            fi
          done
