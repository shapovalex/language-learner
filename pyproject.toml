[project]
name = "language-lab"
version = "0.1.0"
description = "LanguageLab: a local web app for building and reviewing Anki language cards."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "av==19.0.1",
]

[project.scripts]
language-lab = "language_lab.app:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "pytest-playwright==0.10.0",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
]
xfail_strict = true
markers = [
    "unit: pure logic, no I/O (auto-applied under tests/unit)",
    "integration: adapters against recorded HTTP fixtures (auto-applied under tests/integration)",
    "api: HTTP through TestClient (auto-applied under tests/api)",
    "e2e: Playwright against the live server (auto-applied under tests/e2e)",
    "smoke: runs before everything else",
    "p0: critical path, must pass",
    "p1: high priority",
    "p2: medium priority",
    "p3: low priority",
    "live_anki: needs a real Anki with the dev Prefix; skipped unless --live-anki",
]

[tool.coverage.run]
source = ["language_lab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
