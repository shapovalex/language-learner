# tickets.toml — the entries of epic-capture-to-item (epic 4) in build order.
[[entry]]
id = 1
type = "story"
title = "Tracer: save a hand-filled Item from a Capture"
description = "Adds domain/items.py (ItemContent as the flat Pydantic union discriminated by category for Vocabulary and Sentence, russian plus russianAlternatives with no commas per AD-10, and normalize_text per AD-12); AnkiStore.save_item on the port, AnkiConnect adapter and fake, behind the setup gate, Prefix guard and Anki lock, as create-or-update by ItemId (AD-20), taking audio: keep | replace | remove with only keep built here (epic-reference-audio adds the others), in the AD-6 keep order: add a new note to its Language/Category Pronunciation deck with allowDuplicate true, then move cards 0-2 to their Study decks, or update fields of an existing note, all through the codec; features/drafts with the blank-Draft endpoint that issues the ItemId (AD-8) and features/items with the Save endpoint, wired in app.py; and the Make an Item pane inside Capture detail (S-NewItem on the phone, the right pane of S-CapturesDesk on desktop) with Use as is or custom Target text, Language and Category, with a 'Write it myself' link that opens a blank Draft in the Draft editor at /captures/<captureId>/new (AD-13) per C-Draft/S-DraftPhone with every field editable, marked dirty through router.setDirty, whose Save returns to the same Capture with the EXPERIENCE.md success banner. Generation context and Generate Draft are entry 2's; the blank path stays after it."
verify = "Pytest against the fake and fixtures (hand-built for changeDeck and updateNoteFields, confirmed at entry 4) shows one Save making one note with exactly four Cards in the right Study and Pronunciation decks, a retried Save with the same ItemId updating that note, comma-containing alternatives refused, and a gated Anki writing nothing; Playwright shows a Vocabulary and a Sentence Item saved from one Capture, each returning to it with the success banner."
covers = ["CAP-4", "CAP-7"]
after = ["1.7", "2.4", "2.8", "3.2"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "OpenRouter Draft generation"
description = "Adds the per-Category generated-fields models (ItemContent without mnemonic and without Sentence example) and one strict_json_schema() with a test of its rules (AD-11); adapters/openrouter calling the models in OPENROUTER_MODELS order with that schema and the addendum A4 call parameters and NFR-8 privacy routing, validating the reply with one retry then llm_invalid_output; extends features/drafts with a generated Draft (issuing the ItemId like the blank one) taking Target text, Language, Category and Generation context that is never persisted or logged, behind a generation function epic-maintain-items reuses for per-field regeneration (AD-11); and in the Make an Item pane the Generation context field and Generate Draft beside the kept 'Write it myself' link, filling the Draft editor, with Vocabulary Drafts showing a removable example and no mnemonic, nothing reaching Anki until Save, and EXPERIENCE.md error copy; plus the model-evaluation fixtures section of the setup docs (FR-4, FR-17)."
verify = "Pytest with recorded or hand-built OpenRouter replies shows the schema assertion, a valid Draft returned, an invalid reply retried once then llm_invalid_output, a reordered OPENROUTER_MODELS changing the model called, and Generation context absent from Anki writes and logs; Playwright shows Generate filling the editor, the example removed before Save, and the error state."
covers = ["CAP-4", "CAP-5"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Duplicate warning, Item read, and view-only Item detail"
description = "Adds AnkiStore reads of scoped Item candidates for one Language and Category and of one Item by ItemId (exact note-type and deck scopes, no user text in queries, AD-4); GET /api/items/<lang>/duplicates?category=&target= matching normalized Target in the service and excluding the Item's own ItemId (AD-12), and GET of one Item with not_found; the duplicate sheet per S-Duplicate shown before creating and when Target text is edited, offering Open existing, Cancel and Create anyway, never blocking creation; and the view-only Item detail screen per S-ItemDetail on its own route, which Open existing opens."
verify = "Pytest shows a normalized match (case, punctuation, whitespace, apostrophe variants) found in the same Language and Category, diacritics kept significant, matches in the other Language or Category not returned, and the Item's own ItemId excluded; Playwright shows the sheet's three choices, Create anyway saving, and Open existing landing on the Item detail with its values."
covers = ["CAP-6"]   # Item read and view-only detail are here by the epic's 2026-10-08 Decision
after = [2]   # shares the New Item and Draft editor screens with entry 2
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Card templates and acceptance on the released wheel"
description = "Replaces the working Understand, Produce and Write template markup and cards.css under adapters/anki/templates/ with the agreed fronts, backs, hints and audio placement (FR-21, AD-10) in the DESIGN.md Studio palette, so Setup shows a templates Repair row for an existing collection; then the user releases the epic and on the Mac Mini with the LanguageLabDev Prefix makes an English Vocabulary and a French Sentence Item from one Capture on the iPhone, applies the templates Repair on LanguageLabDev, checks four Cards in the right decks with independent schedules, a Draft, the duplicate sheet and Open existing, a retried Save, the templates in Anki Desktop and AnkiMobile with a test clip stored in Anki, checks the unsaved-changes alert on the dirty Draft editor on iOS Safari swipe-back and return-from-background on iPhone and iPad (deferred R-03), records a notesInfo of a Hint edited with blank lines in Anki for the deferred decode_field question, measures the Setup preview read_leftovers cost with real LanguageLab cards (deferred from 2.13), and checks the hand-built Anki fixtures against real replies; findings are fixed or ticketed."
verify = "Pytest shows the manifest templates read only the AD-10 fields; Done when 1-5 of the epic, the R-03 check and the read_leftovers timing are recorded step by step in an acceptance file under _bmad-output/test-artifacts/acceptance/."
covers = ["CAP-4", "CAP-5", "CAP-6", "CAP-7"]
after = [1, 2, 3]
hitl = true   # the user tags a release and runs it on the Mac Mini, iPhone and AnkiMobile
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Refactor sweep"
description = "Takes cleanup deferred in the plans and review findings of the other entries; scope is set when it starts."
verify = "pytest, Playwright, and ruff pass unchanged in behavior after the cleanup."
covers = ["CAP-4", "CAP-5", "CAP-6", "CAP-7"]
after = [1, 2, 3, 4]
hitl = false
risk = "low"
