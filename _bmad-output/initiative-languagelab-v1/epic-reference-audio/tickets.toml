[[entry]]
id = 1
type = "story"
title = "Preview and save Reference audio from a Draft"
description = "Delivers the Draft-to-Anki tracer with the Speech port and Azure REST adapter, current locale-filtered Voice lists for en-US and fr-CA, independent browser Voice preferences, memory-only MP3 Preview and Keep current or Use preview, exact-Blob multipart Save with audio=replace, backend-computed managed filenames, media storage before the note write, guarded /api/media playback and an Item read contract exposing the saved audio reference for 6.2, using api.js for binary requests and retaining ordinary audio=keep Save."
verify = "Pytest with fake ports and recorded Azure HTTP fixtures plus phone and desktop Playwright show a Draft Voice selection, explicit Preview and Use preview then Save producing byte-identical MP3 playback from /api/media with four correct Cards, no Anki writes during Preview, independent browser locale preferences with no automatic regeneration on Voice change, and visible recoverable Voice, TTS and Save errors retaining local edits and preserving prior note and audio values until the note write succeeds without exposing credentials or content in logs."
covers = ["CAP-9"]
after = ["4.1", "4.3"]
hitl = false
risk = "high"

