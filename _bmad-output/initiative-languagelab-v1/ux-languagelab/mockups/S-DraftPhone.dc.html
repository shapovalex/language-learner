<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio — Draft editor (iPhone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5A45C8}a:hover{color:#3F2F96}
</style>
</helmet>
<div style="width: 390px; height: 1500px; box-sizing: border-box; background: #FFF8F1; color: #221E2E; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 0">
  <header style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
    <a href="S-NewItem.dc.html" style="display: flex; align-items: center; gap: 4px; text-decoration: none; font-size: 15px; font-weight: 600; min-height: 44px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Capture
    </a>
    <span style="font-size: 13px; font-weight: 600; background: #FFEBC7; color: #7A4A00; border-radius: 12px; padding: 4px 10px">Draft — not saved yet</span>
  </header>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">jump to conclusions</h1>
    <div style="display: flex; gap: 6px; font-size: 13px; font-weight: 600"><span style="background: #ECE8FB; color: #2E2470; border-radius: 12px; padding: 4px 10px">English</span><span style="background: #ECE8FB; color: #2E2470; border-radius: 12px; padding: 4px 10px">Vocabulary</span></div>
  </div>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(34,30,46,0.06), 0 6px 20px rgba(34,30,46,0.06)">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Target
      <input value="jump to conclusions" style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #948A7E; border-radius: 14px; color: #221E2E">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Russian meaning
      <textarea rows="2" style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #948A7E; border-radius: 14px; color: #221E2E; resize: none">делать поспешные выводы; торопиться с выводами</textarea>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Part of speech
      <input value="idiom (verb phrase)" style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #948A7E; border-radius: 14px; color: #221E2E">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Grammar
      <input value="jump to conclusions about sth" style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #948A7E; border-radius: 14px; color: #221E2E">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Hint <span style="font-weight: 400; color: #5C5669">optional</span>
      <input value="" placeholder="Shown on Produce and Write" style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #948A7E; border-radius: 14px; color: #221E2E">
    </label>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(34,30,46,0.06), 0 6px 20px rgba(34,30,46,0.06)">
    <div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 16px; font-weight: 700">Example</h2><button style="font: inherit; font-size: 14px; font-weight: 600; color: #5A45C8; background: none; border: none; min-height: 44px; padding: 0 8px">Clear</button></div>
    <p style="margin: 0; font-size: 17px; font-weight: 500; line-height: 1.45">Let's not jump to conclusions before we've seen the data.</p>
    <p style="margin: 0; font-size: 15px; color: #5C5669">Давай не будем делать поспешных выводов, пока не увидим данные.</p>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(34,30,46,0.06), 0 6px 20px rgba(34,30,46,0.06)">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Mnemonic <span style="font-weight: 400; color: #5C5669">optional · only you write this</span>
      <textarea rows="2" placeholder="Your own memory aid" style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #948A7E; border-radius: 14px; color: #221E2E; resize: none"></textarea>
    </label>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(34,30,46,0.06), 0 6px 20px rgba(34,30,46,0.06)">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">Reference audio <span style="font-weight: 400; color: #5C5669; font-size: 14px">optional</span></h2>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Voice
      <select style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #948A7E; border-radius: 14px; color: #221E2E; background: #FFFFFF; min-height: 48px"><option>en-US · Andrew</option><option>en-US · Ava</option><option>en-US · Emma</option></select>
    </label>
    <div style="display: flex; align-items: center; gap: 10px">
      <button aria-label="Play audio preview" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #F0EAE2; color: #221E2E; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"></path></svg></button>
      <div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #ECE8FB"><div style="width: 35%; height: 6px; border-radius: 3px; background: #5A45C8"></div></div>
      <span style="font-size: 13px; color: #5C5669">0:02</span>
    </div>
  </section>

  <div style="margin-top: auto; position: sticky; bottom: 0; background: #FFF8F1; border-top: 1px solid #E2DACF; margin-left: -16px; margin-right: -16px; padding: 12px 16px 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button style="height: 52px; border-radius: 26px; border: 2px solid #E2DACF; background: #FFFFFF; color: #221E2E; font: inherit; font-size: 15px; font-weight: 700">Discard</button>
    <button style="grid-column: span 2; height: 52px; border-radius: 26px; border: none; background: #5A45C8; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Save to Anki</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
