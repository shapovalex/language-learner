<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">

  <div aria-hidden="true" style="padding: 12px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #5A45C8">‹ Capture</div>
    <div style="font-size: 28px; font-weight: 700">jump to conclusions</div>
    <div style="background: #FFFFFF; border-radius: 24px; height: 260px"></div>
    <div style="background: #FFFFFF; border-radius: 24px; height: 160px"></div>
  </div>
  <div style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: rgba(34,30,46,0.42)"></div>

  <section role="dialog" aria-labelledby="dup-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; background: #FFF8F1; border-radius: 28px 28px 0 0; padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #E2DACF; align-self: center"></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; font-weight: 600; color: #7A4A00">Possible duplicate · English · Vocabulary</span>
      <h2 id="dup-title" style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25">You already have an Item with this text</h2>
    </div>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; border: 2px solid #FFEBC7">
      <span style="font-size: 17px; font-weight: 700">Jump to conclusions</span>
      <span style="font-size: 15px; color: #5C5669">делать поспешные выводы</span>
    </div>
    <p style="margin: 0; font-size: 14px; color: #5C5669">Nothing has been saved yet. You can still create a second Item.</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button style="height: 52px; border-radius: 26px; border: none; background: #5A45C8; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">Open existing</button>
      <button style="height: 52px; border-radius: 26px; border: 2px solid #E2DACF; background: #FFFFFF; color: #221E2E; font: inherit; font-size: 16px; font-weight: 700">Cancel</button>
      <button style="height: 48px; border-radius: 24px; border: none; background: transparent; color: #5A45C8; font: inherit; font-size: 15px; font-weight: 600">Create anyway</button>
    </div>
  </section>
