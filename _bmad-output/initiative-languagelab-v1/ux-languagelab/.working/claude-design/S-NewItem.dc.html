<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio — Capture to new Item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5A45C8}a:hover{color:#3F2F96}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8F1; color: #221E2E; font-family: 'Figtree', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 20px">
  <header style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
    <a href="S-Captures.dc.html" style="display: flex; align-items: center; gap: 4px; text-decoration: none; font-size: 15px; font-weight: 600; min-height: 44px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Captures
    </a>
    <button style="font: inherit; font-size: 14px; font-weight: 600; color: #8F2F05; background: none; border: none; min-height: 44px; padding: 0 8px">Delete capture</button>
  </header>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 2px rgba(34,30,46,0.06), 0 6px 20px rgba(34,30,46,0.06)">
    <p style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.35">I'd rather not jump to conclusions.</p>
    <span style="font-size: 13px; color: #5C5669">Captured today · 21:14</span>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(34,30,46,0.06), 0 6px 20px rgba(34,30,46,0.06)">
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">Make an Item</h1>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">Text</legend>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px"><input type="radio" name="val" style="width: 20px; height: 20px; accent-color: #5A45C8"> Use as is</label>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px"><input type="radio" name="val" checked style="width: 20px; height: 20px; accent-color: #5A45C8"> Custom value</label>
      <input aria-label="Custom value" value="jump to conclusions" style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #5A45C8; border-radius: 14px; color: #221E2E">
      <span style="font-size: 13px; color: #5C5669">Write it in the language you're learning, not in Russian.</span>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Language</span>
      <div role="group" aria-label="Language" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #F0EAE2; border-radius: 24px; padding: 4px">
        <button aria-pressed="true" style="height: 40px; border-radius: 20px; border: none; background: #5A45C8; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">English</button>
        <button aria-pressed="false" style="height: 40px; border-radius: 20px; border: none; background: transparent; color: #221E2E; font: inherit; font-size: 15px; font-weight: 600">French</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Category</span>
      <div role="group" aria-label="Category" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #F0EAE2; border-radius: 24px; padding: 4px">
        <button aria-pressed="true" style="height: 40px; border-radius: 20px; border: none; background: #5A45C8; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">Vocabulary</button>
        <button aria-pressed="false" style="height: 40px; border-radius: 20px; border: none; background: transparent; color: #221E2E; font: inherit; font-size: 15px; font-weight: 600">Sentence</button>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Generation context <span style="font-weight: 400; color: #5C5669">optional · used once, never saved</span>
      <input placeholder="e.g. the sentence it came from" value="" style="font: inherit; font-weight: 500; font-size: 16px; padding: 12px 14px; border: 2px solid #E2DACF; border-radius: 14px; color: #221E2E">
    </label>
  </section>

  <button style="margin-top: auto; height: 56px; border-radius: 28px; border: none; background: #5A45C8; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 700">Generate draft</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
