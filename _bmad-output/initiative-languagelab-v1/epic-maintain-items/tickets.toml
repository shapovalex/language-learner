# Approved breakdown for Maintain Items (epic 5), in build order.
# Entries remain planned until built; no leaf files are needed.

[[entry]]
id = 1
type = "story"
title = "Search, open, and edit existing Items"
description = "Delivers the list-to-Save tracer: debounced normalized substring search over Target, Russian meaning and alternatives across both Categories of one Language, responsive results with loading, empty and error states and existing-audio presence, fresh Item reads and editable detail using the existing Save with the same ItemId and audio=keep, duplicate rechecks excluding that ItemId when Target changes, and router-managed unsaved changes with edits retained after failure."
verify = "Pytest and Playwright at phone and desktop widths show Language-scoped matches with AD-12 normalization, direct Anki edits visible on reopen, duplicate choices retaining the existing Item identity, and Save updating that note with unchanged Card identities and histories while a failed Save preserves prior values, audio and local edits."
covers = ["CAP-8"]
after = ["4.1", "4.3"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Regenerate content with Current vs Preview"
description = "Extends the editable detail from 5.1 with regeneration of Russian meaning and alternatives, the Vocabulary example and its Russian translation, and the Sentence Note, reusing the full Category generation model from 4.2 without allocating a new ItemId, with Current vs Preview, Keep current and Use preview changing only the requested field group in the local edit buffer until explicit Save."
verify = "Pytest and Playwright show regeneration returning the full validated Category model with the existing retry and error behavior, Keep current and Use preview making no Anki writes, unrelated unsaved fields and ItemId retained, generation failure preserving the current buffer, and Save alone committing accepted preview fields to the existing note."
covers = ["CAP-8"]
after = [1, "4.2"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Delete Items and verify Maintain Items on the released wheel"
description = "Adds Item deletion using the reusable confirmation from 3.3 naming the Target and all four Cards, guarded and locked note deletion before cleanup of every managed media filename for that Prefix and ItemId, Cancel, failure and retry behavior and return to the refreshed Items list, then the user releases the epic and verifies all five Done when checks on the Mac Mini with LanguageLabDev from phone and desktop, including reviewed Cards and a test media clip without waiting for epic 6."
verify = "Pytest and Playwright prove Cancel preserves the Item, confirmation removes only its note, four Cards, histories and matching managed media, failures stop the AD-6 sequence and retries tolerate an already-deleted note, and other Items and Prefixes stay untouched; the user records passing released-wheel checks for AC11, AC12, FR-24, search and AC21 with Anki replies checked against fixtures in an acceptance file under _bmad-output/test-artifacts/acceptance/."
