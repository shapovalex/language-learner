# tickets.toml — the entries of epic-anki-setup-sync (epic 2) in build order.

[[entry]]
id = 1
type = "story"
title = "Tracer: AnkiConnect readiness on the Setup screen"
description = "Stands up ports/AnkiStore (readiness and sync signatures only) with its in-memory fake in tests/fakes/, adapters/anki/client.py (one httpx.AsyncClient, AnkiConnect API v6, 10 s default and 120 s sync timeouts, failures mapped to anki_unavailable) and lock.py (one asyncio.Lock, 15 s wait then anki_busy), features/setup with GET /api/setup/readiness reporting AnkiConnect reachability, Azure and OpenRouter keys configured, and the Prefix in effect, wired in app.py, and the Setup screen showing one tile per check with skeleton, fix hints, and the subtitle naming the Prefix; plus an `anki` subcommand of `language-lab-record-fixtures` that records AnkiConnect's version response, the bare command keeping its Tailscale behavior so existing docs stay true."
verify = "Pytest against the fake and a recorded fixture shows each check passing and failing on its own and lock timeout returning anki_busy; Playwright shows the tiles; on the Mac Mini the released wheel's /setup shows AnkiConnect reachable with Anki open and unreachable with it closed."
covers = ["CAP-2"]
after = ["1.3", "1.6", "1.8"]
hitl = true   # the user tags a release and runs it on the Mac Mini with Anki open and closed
risk = "medium"

[[entry]]
id = 2
type = "spike"
title = "AnkiConnect behavior for Setup and Sync"
description = "Extends `language-lab-record-fixtures anki` to probe, in a throwaway Anki profile on the Mac Mini logged in to a throwaway AnkiWeb account, using its own LLProbe-prefixed names and refusing to run when the active profile holds any LanguageLab or LanguageLabDev note type, every AnkiConnect action the epic uses (createModel, modelFieldNames, modelFieldAdd, model templates and styling read/update, createDeck, deckNames, deck-config get/clone/save/set, findNotes/notesInfo, media listing, sync) and record redacted fixtures to tests/fixtures/anki/; answers whether a field-changing action raises a modal in Anki Desktop, how sync reports full-sync-required, not-logged-in, and offline, and which deck-config keys hold the three sibling-burying flags."
verify = "tests/fixtures/anki/ holds a recorded response per action, and the spike's findings answer each question with the fixture that shows it; the user's real collection and LanguageLabDev are untouched."
covers = ["CAP-2", "CAP-11"]
after = [1]
hitl = true   # the user creates the throwaway profile and AnkiWeb account and runs the probe from the released wheel on the Mac Mini
risk = "high"

[[entry]]
id = 10
type = "story"
title = "Sync feature: coalesced, scheduled, non-blocking"
description = "Adds ports/SyncRequester with its fake, features/sync coalescing to one running and one pending Sync through AnkiStore.sync under the lock with the 120 s timeout, an app lifespan that requests Sync at startup, every five minutes, and at graceful shutdown capped at 30 s, a request-and-await call for Setup made outside the lock, dev mode disabling all Sync, failures logged and never raised, and the last status including full-sync-required kept in memory."
verify = "Pytest with a fake clock shows startup, five-minute, and shutdown requests, ten concurrent requests coalescing into at most two Syncs, a failing or hung AnkiConnect logged without failing a request or delaying shutdown past 30 s, and no Sync in dev mode."
covers = ["CAP-11"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Managed manifest, template files, and field codec"
description = "Adds adapters/anki/manifest.py declaring from ANKI_PREFIX the five note types with fields (hidden ItemId/CaptureId and SchemaVersion), the ord 0–3 to Exercise to deck mapping, the 28-deck tree, the `<Prefix>` preset with its three bury flags, the current SchemaVersion, and working front/back templates and CSS under adapters/anki/templates/ packaged in the wheel; plus adapters/anki/codec.py per AD-9 (write escapes & < > and \\n to <br>; read maps <br> and block tags to \\n, strips other tags, unescapes, NBSP to space) and the AD-10 RussianAlternatives join and split with `, `, the only field conversion that later entries (8, 11) and epics read through."
verify = "Pytest shows every name derived from the Prefix (LanguageLab vs LanguageLabDev never overlap), 5 note types with the A3/AD-10 fields, 28 decks, four card templates per Item note type and one for Capture, the template files present in the built wheel, and table-driven codec round-trips for plain text, newlines, quotes, entities, Anki-editor markup, NBSP, and alternatives."
covers = ["CAP-2"]
after = [1]   # owner of the adapters/anki package
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Prefix guard and Setup preview without touching Anki"
description = "Adds the AD-4 guard inside adapters/anki rejecting any write, delete, move, preset, or media operation whose target is not a manifest resource, a note of a manifest note type, the `<Prefix>` preset, or an AD-7 media name, one query builder emitting only exact deck:\"<Prefix>::<path>\" and note:\"<type>\" scopes with no user text, an AnkiStore read of the managed state (note types, fields, templates, CSS, decks, preset assignment and bury flags), diff(manifest, Anki) into Create, Repair, and Migrate plan items with a plan hash, unrecognized content under the Prefix as read-only \"Not managed by LanguageLab\" rows, GET /api/setup/plan, and the Setup screen's change list headed \"What will change in Anki\" / \"Nothing changes until you apply.\" or the \"Nothing to change\" callout, with the EXPERIENCE.md subtitle and the study-not-the-root footer."
verify = "Pytest shows out-of-Prefix writes (including LanguageLabDev targets from a LanguageLab Prefix) rejected before any request is sent and every built query in exact-scope form; against recorded fixtures an empty Prefix previews 5 note types, 28 decks, templates and CSS, and the preset, a set-up Prefix previews nothing, a changed template previews one Repair, and the adapter issues no write action during preview."
covers = ["CAP-2"]
after = [2, 4, 10]   # 10: same adapter, port, and fake files
hitl = false
risk = "high"
refine = true

[[entry]]
id = 7
type = "story"
title = "Confirmed apply and verify"
description = "Adds POST /api/setup/apply carrying the plan hash, which re-diffs and refuses a stale plan, runs the plan to completion server-side even if the client disconnects, writes only through the Prefix guard, creates and assigns the `<Prefix>` preset setting only the three bury flags off, then verifies by a fresh diff; the screen disables Apply with \"Fix the failing check to continue.\" while a readiness check fails, and shows the Applying card, the verified banner, or the discrepancy list with Run Setup again; leaving does not cancel, and coming back re-reads Anki and shows the result or the current change list."
verify = "Pytest against the fake shows apply then a second preview empty, a stale hash refused, user-set deck options other than the bury flags untouched by a repair, and a disconnect mid-apply still completing; Playwright shows Applying, verified, and discrepancy states."
covers = ["CAP-2"]
after = [6]
hitl = false
risk = "high"

[[entry]]
id = 8
type = "story"
title = "SetupState and the write gate"
description = "Computes SetupState (ready, needs_setup, needs_migration, newer_schema, with each note's SchemaVersion read through the codec) at startup, after every apply, and on each Setup visit; the adapter returns 409 setup_required for every non-Setup write unless ready while reads stay allowed, refuses to update a note whose SchemaVersion differs from the manifest's, and Setup shows the newer_schema blocking alert with Apply hidden."
verify = "Pytest shows each state from fixtures, a non-Setup write gated in every state but ready, a read allowed, a mismatched-SchemaVersion note update refused, and Playwright shows the newer_schema alert."
covers = ["CAP-2"]
after = [7]
hitl = false
risk = "medium"

[[entry]]
id = 9
type = "story"
title = "Schema migrations and full-sync steps"
description = "Adds ordered migrations keyed by SchemaVersion shown as Migrate rows and run only inside a confirmed plan, never at startup, rewriting a note's SchemaVersion only there; flags field-changing steps requires full sync, awaits a Sync through SyncRequester outside the Anki lock before applying them, tells the user to upload in Anki Desktop, and shows the Full sync required readiness tile from the last Sync status."
verify = "A test-only v1 to v2 fixture migration previews as Migrate, does nothing at startup, runs once after confirmation and is a no-op on a second run, stays inside the Prefix, and the full-sync flag and tile appear per the spike's recorded sync results."
covers = ["CAP-2"]
after = [8]
hitl = false
risk = "high"

[[entry]]
id = 11
type = "story"
title = "Opt-in repairs for leftovers"
description = "Adds orphan media (an AD-7 name no note's Audio field references, read through the codec), managed cards in the wrong deck for their ord, and unsuspended Capture cards to the plan as repair rows each with an unchecked checkbox, only checked rows entering the plan and its hash, while non-managed notes and decks stay read-only."
verify = "Fixtures with each leftover preview an unchecked repair row, apply without checking changes nothing, checking one changes exactly that resource and changes the hash, and a non-managed note is never touched."
covers = ["CAP-2"]
after = [9]   # same setup service and screen
hitl = false
risk = "medium"

