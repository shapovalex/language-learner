# tickets.toml — the entries of epic-captures (epic 3) in build order.

[[entry]]
id = 1
type = "story"
title = "Tracer: save a Capture from the Captures screen"
description = "Adds AnkiStore.create_capture (to the port, the AnkiConnect adapter and the fake together) that, behind the setup gate and the Prefix guard and under the Anki lock, looks up the CaptureId by querying the exact Capture note-type scope and filtering notesInfo in Python (no user text in any query, AD-4), returns the existing note unchanged when found (AD-20), else adds the note to <Prefix>::Captures with Text, a server-set CreatedAt (ISO UTC with Z), CaptureId and SchemaVersion written through the codec and allowDuplicate true, then suspends its card (AD-6); features/captures with POST /api/captures taking a client-generated UUIDv4 CaptureId (AD-8) and non-empty text (validation_failed otherwise), wired in app.py; and the Captures screen's compose box per S-Captures, which generates the CaptureId once per composition and keeps it across retries, disables Save while empty or busy, marks the screen dirty through router.setDirty while unsaved text exists (adding a Capture variant to the router's unsaved-changes alert copy) and clears it on Save, and on failure keeps the text and shows the EXPERIENCE.md error copy (for anki_unavailable \"Not saved — Anki isn't reachable\" / \"Make sure Anki Desktop is open on the Mac mini, then try again. Your text is still here.\" with Try again), never reporting the Capture as saved."
verify = "Pytest against the fake and fixtures (recorded where they exist, hand-built for suspend and confirmed at entry 4) shows a new Capture added then suspended, the same CaptureId posted twice making one note, empty text refused, and a gated or failing Anki returning its error with no note; Playwright shows Save clearing the box on success, leaving with unsaved text raising the alert with the Capture copy, and the error copy with text kept and Try again when the API fails."
covers = ["CAP-3"]
after = ["1.7", "2.8"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Captures list and Capture detail"
description = "Adds AnkiStore.list_captures and get_capture (exact Capture note-type scope, notesInfo read through the codec, Anki ids kept in the adapter), GET /api/captures newest first by CreatedAt and GET /api/captures/{captureId} with not_found, a /captures/<captureId> route in router.js, and the screens per S-Captures, S-CapturesDesk and EXPERIENCE.md: on the phone the list under the compose box and Capture detail as its own screen with the \"‹ Captures\" back link; on desktop and iPad landscape list and detail in two panes with the open Capture selected; text and relative creation time (\"Captured today · 21:14\"), the \"Newest first\" / \"N Captures · newest first\" headers, list skeleton, empty state, and a newly saved Capture at the top. The Make an Item pane is epic-capture-to-item's."
verify = "Pytest shows ordering, codec decoding of Anki-editor markup, and an unknown CaptureId returning not_found; Playwright at phone and desktop widths shows the list newest first, skeleton and empty state, a saved Capture at the top, and opening one landing on its detail (own screen on phone, selected pane on desktop)."
covers = ["CAP-3"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Delete a Capture after confirmation"
description = "Adds AnkiStore.delete_capture behind the setup gate and Prefix guard deleting only the note with that CaptureId (a retried delete of a missing one succeeds), DELETE /api/captures/{captureId}, and the confirmation dialog per S-Delete built on the router's existing alertdialog (focus trap, Esc, focus return) so Item delete in epic-maintain-items reuses it, opened from Capture detail with the title \"Delete this Capture?\", the body \"This removes the Capture from Anki. Items you made from it stay.\", and Cancel and Delete permanently; after delete the user lands on the list without it (desktop with nothing selected), and a failure keeps the Capture and shows the error."
verify = "Pytest shows only the targeted note deleted, other Captures and non-managed notes untouched, and a repeated delete succeeding; Playwright shows Cancel keeping the Capture, Delete permanently removing it from the list, keyboard focus behavior, and the error state."
covers = ["CAP-3"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Acceptance on the released wheel from the iPhone"
description = "The user releases the epic and on the Mac Mini with a set-up LanguageLabDev Prefix saves a Capture from the iPhone over Tailscale, sees it suspended under <Prefix>::Captures in Anki Desktop, replays the same request and finds no second note, checks the list on iPhone and desktop, deletes one after confirmation, saves with AnkiConnect down and sees the error, and checks the unsaved-changes alert on the dirty compose box on iOS Safari swipe-back and return-from-background on iPhone and iPad (deferred R-03); the hand-built suspend and deleteNotes fixtures are checked against the real responses; findings are fixed or ticketed."
verify = "Each of Done when 1–4 and the R-03 check is recorded passing step by step in an acceptance file under _bmad-output/test-artifacts/acceptance/."
covers = ["CAP-3"]
after = [3]
hitl = true   # the user tags a release and runs it on the Mac Mini and iPhone
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Refactor sweep"
description = "Takes cleanup deferred in the plans and review findings of the other entries; scope is set when it starts."
verify = "pytest, Playwright, and ruff pass unchanged in behavior after the cleanup."
covers = ["CAP-3"]
after = [1, 2, 3, 4]
hitl = false
risk = "low"
