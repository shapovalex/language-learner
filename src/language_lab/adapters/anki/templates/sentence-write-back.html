<div class="ll-card">
  <div class="overline">Write</div>
  <div class="prompt">{{Russian}}</div>
  {{#Hint}}<div class="hint">{{Hint}}</div>{{/Hint}}
</div>

<hr id="answer">

<div class="ll-card answer">
<div class="typed">{{type:Target}}</div>
{{#Audio}}<div class="audio">{{Audio}}</div>{{/Audio}}
{{#RussianAlternatives}}<div class="meta alternatives">{{RussianAlternatives}}</div>{{/RussianAlternatives}}
{{#Note}}<div class="note"><div class="label">Note</div>{{Note}}</div>{{/Note}}
</div>
