<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LanguageLab</title>
    <link rel="stylesheet" href="/static/{{VERSION}}/css/studio.css">
    <script type="module" src="/static/{{VERSION}}/main.js"></script>
  </head>
  <body>
    <header class="app-header">
      <span class="wordmark">LanguageLab</span>
      <nav class="main-nav" aria-label="Main">
        <a class="nav-pill" href="/captures" data-area="captures">Captures</a>
        <a class="nav-pill" href="/en/items" data-area="en">English</a>
        <a class="nav-pill" href="/fr/items" data-area="fr">French</a>
        <a class="nav-pill" href="/setup" data-area="setup">Setup</a>
      </nav>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="menu-sheet">Menu</button>
    </header>
    <div class="scrim" hidden></div>
    <div class="menu-sheet" id="menu-sheet" role="dialog" aria-modal="true" aria-labelledby="menu-sheet-title" hidden>
      <h2 class="menu-sheet-title" id="menu-sheet-title">Menu</h2>
      <a class="list-row" href="/captures" data-area="captures">Captures</a>
      <a class="list-row" href="/en/items" data-area="en">English</a>
      <a class="list-row" href="/fr/items" data-area="fr">French</a>
      <a class="list-row" href="/setup" data-area="setup">Setup</a>
    </div>
    <dialog class="alert-dialog" id="unsaved-alert" role="alertdialog" aria-labelledby="unsaved-alert-title" aria-describedby="unsaved-alert-body">
      <h2 class="alert-dialog-title" id="unsaved-alert-title">Discard unsaved changes?</h2>
      <p class="alert-dialog-body" id="unsaved-alert-body"></p>
      <div class="alert-dialog-actions">
        <button class="button button-destructive" type="button" value="discard">Discard</button>
        <button class="button button-secondary" type="button" value="keep">Keep editing</button>
      </div>
    </dialog>
    <dialog class="alert-dialog" id="confirm-dialog" role="alertdialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-body">
      <div class="alert-dialog-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg>
      </div>
      <h2 class="alert-dialog-title" id="confirm-dialog-title"></h2>
      <div class="alert-dialog-body" id="confirm-dialog-body"></div>
      <div class="alert-dialog-actions">
        <button class="button button-destructive" type="button" value="confirm"></button>
        <button class="button button-secondary" type="button" value="cancel">Cancel</button>
      </div>
    </dialog>
    <main id="app"></main>
  </body>
</html>
